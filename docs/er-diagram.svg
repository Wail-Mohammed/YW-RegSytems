<text x="40" y="950" font-size="19" font-weight="bold">Read both ends: || = exactly one (1..1); circle + crow's foot = zero or many (0..N).</text>
<text x="40" y="980" font-size="17">Each association row has mandatory parent references. A parent can exist without any child rows. See RELATIONSHIPS.md for all 12 rules.</text>
<text x="40" y="1008" font-size="16">PK = primary key; FK = foreign key; UQ = unique key. All attributes and composite unique constraints appear in sql/schema.sql.</text>
